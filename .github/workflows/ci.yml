name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run unit tests
        run: mvn --batch-mode verify

  integration-tests:
    name: Integration tests (APIM ${{ matrix.apim }})
    runs-on: ubuntu-latest
    needs: [unit-tests]

    strategy:
      # Report every leg. A break on one APIM version must not hide the others.
      fail-fast: false
      matrix:
        apim:
          # Floor of the 4.12 line — first release on Vert.x 5, and the first to
          # ship gravitee-reporter-api 2.x in the gateway (this plugin compiles
          # against 2.1.0 and does not bundle it, so the gateway's copy is what
          # it binds at runtime).
          - "4.12.0"
          # Latest published release: early warning for upstream breakage.
          - "4.12.12"
      # Both legs hit the same live Sentry project; run them one at a time so
      # their events cannot interleave and confuse the readback assertions.
      max-parallel: 1

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache Docker images
        id: docker-cache
        uses: actions/cache@v5
        with:
          path: /tmp/docker-images
          # The APIM version must be part of the key, or the first leg's images
          # would be replayed for every other leg.
          key: docker-${{ matrix.apim }}-${{ hashFiles('src/test/java/**/SentryReporterIT.java') }}
      - name: Load Docker images from cache
        if: steps.docker-cache.outputs.cache-hit == 'true'
        run: docker load -i /tmp/docker-images/images.tar
      - name: Pull and save Docker images
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run: |
          docker pull mongo:7.0
          docker pull graviteeio/apim-management-api:${{ matrix.apim }}
          docker pull mccutchen/go-httpbin
          docker pull graviteeio/apim-gateway:${{ matrix.apim }}
          mkdir -p /tmp/docker-images
          docker save \
            mongo:7.0 \
            graviteeio/apim-management-api:${{ matrix.apim }} \
            mccutchen/go-httpbin \
            graviteeio/apim-gateway:${{ matrix.apim }} \
            -o /tmp/docker-images/images.tar
      - name: Run integration tests
        run: mvn --batch-mode verify -Pintegration-test -Dapim.version=${{ matrix.apim }}
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_TEST_TOKEN: ${{ secrets.SENTRY_TEST_TOKEN }}
          SENTRY_TEST_PROJECT: ${{ vars.SENTRY_TEST_PROJECT }}
          SENTRY_TEST_ORG: ${{ vars.SENTRY_TEST_ORG }}
